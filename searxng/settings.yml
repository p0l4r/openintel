use_default_settings:
  engines:
    # Keep only general web engines (+ Wikipedia/Wikidata, which are reliable for entities).
    # Tor-only and custom engines in the defaults just produce errors.
    keep_only:
      - wikipedia
      - wikidata
      - bing
      - mojeek
      - startpage
      - yahoo
      - duckduckgo
      - brave
server:
  secret_key: "change-me-searxng"
  limiter: false
search:
  formats: [html, json]
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
